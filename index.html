<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa Pro</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
    display: flex; flex-direction: column; align-items: center; justify-content: center; 
    color: white; font-family: sans-serif; cursor: pointer; z-index: 100;
  }
  #overlay h1 { font-size: 40px; text-shadow: 2px 2px 4px #000; margin: 0; }
  .hud { position: fixed; bottom: 10px; left: 10px; color: white; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; pointer-events: none; z-index: 10;}
</style>
</head>
<body>
<div id="overlay">
  <h1>Haz Clic para entrar</h1>
  <p>WASD para mover · Espacio/Ctrl para volar</p>
</div>
<div class="hud" id="zone">Cargando motor...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>

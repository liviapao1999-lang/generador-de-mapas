<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Editor de Castillos PRO v21</title>
<style>
  :root { --bg: #0f1115; --panel: #181b21; --border: #2c313c; --text: #e2e8f0; --primary: #3b82f6; --accent: #f59e0b; --danger: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, sans-serif; overflow: hidden; user-select: none; }
  #topbar { display: flex; gap: 6px; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; z-index: 10; }
  button, input, select { background: #222730; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font: inherit; outline: none; }
  button { cursor: pointer; font-weight: bold; transition: all 0.1s; }
  button:hover { background: #2c333e; }
  button:disabled { opacity: .35; cursor: default; }
  button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.danger { background: #351a1a; border-color: var(--danger); color: #fca5a5; }
  button.danger:hover { background: var(--danger); color: #fff; }
  .separator { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
  #level-input { background: #0f766e; color: white; font-weight: bold; border-color: #0d9488; width: 70px; text-align: center; }
  #level-wrap { display: flex; align-items: center; gap: 4px; background: #0f766e; border: 1px solid #0d9488; border-radius: 6px; padding: 2px 6px; }
  #level-wrap label { color: white; font-weight: bold; font-size: 12px; white-space: nowrap; }
  #level-wrap button { background: #0d9488; border: none; color: white; padding: 2px 8px; font-size: 14px; line-height: 1; }
  #level-wrap button:hover { background: #14b8a6; }
  #canvas-container { flex: 1; position: relative; overflow: hidden; cursor: grab; }
  #canvas-container:active { cursor: grabbing; }
  #canvas-container.painting { cursor: crosshair; }
  #cv { display: block; width: 100%; height: 100%; }
  #properties { background: var(--panel); border-top: 1px solid var(--border); padding: 10px; display: flex; flex-wrap: wrap; gap: 16px; min-height: 130px; align-items: flex-start; z-index: 10; overflow-y: auto; }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-group label { font-size: 10px; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
  .field-group input { width: 70px; padding: 4px 8px; }
  .field-group input[type="text"] { width: 140px; }
  .field-group select { width: 120px; padding: 4px 8px; }
  .row-inputs { display: flex; gap: 8px; align-items: center; }
  #hud { position: absolute; bottom: 10px; left: 10px; color: #64748b; pointer-events: none; font-family: monospace; }
  #hint { position: absolute; bottom: 10px; right: 10px; color: #475569; pointer-events: none; font-size: 11px; text-align: right; }
  #status { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; font-weight: bold; pointer-events: none; }
  #toast { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(15,118,110,.95); padding: 6px 14px; border-radius: 6px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #toast.show { opacity: 1; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.open { display: flex; }
  .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: min(920px, 96vw); max-height: 94vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal-head, .modal-foot { padding: 10px 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .modal-head { border-bottom: 1px solid var(--border); font-size: 14px; }
  .modal-foot { border-top: 1px solid var(--border); }
  .modal-body { display: flex; gap: 16px; padding: 12px 14px; overflow: auto; flex-wrap: wrap; }
  .modal-left { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 14px; flex: 1; min-width: 300px; align-content: start; }
  .modal-left .full { grid-column: 1 / -1; }
  .modal-left input, .modal-left select { width: 100%; padding: 5px 8px; }
  .modal-right { flex: 1.3; min-width: 320px; }
  #dd-canvas { display: block; width: 100%; height: auto; background: #0b0d11; border: 1px solid var(--border); border-radius: 8px; }
  #dd-msg { color: #5eead4; font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
<div id="topbar">
  <div id="level-wrap">
    <label>Y</label>
    <button onclick="nudgeLevel(-1)" title="Bajar 1 m">−</button>
    <input id="level-input" type="number" step="0.5" value="0" onchange="changeLevel(this.value)" oninput="changeLevel(this.value)">
    <button onclick="nudgeLevel(1)" title="Subir 1 m">+</button>
  </div>
  <div class="separator"></div>
  <button id="btn-sala" class="active" onclick="setTool('sala')">⬛ Suelo</button>
  <button id="btn-poly" onclick="setTool('poly')">⬡ Polilínea</button>
  <button id="btn-hueco" onclick="setTool('hueco')" style="color:#ef4444;">🕳️ Hueco</button>
  <button id="btn-rampa" onclick="setTool('rampa')">📐 Rampa</button>
  <button id="btn-escalera" onclick="setTool('escalera')">🪜 Escalera</button>
  <button id="btn-pared" onclick="setTool('pared')">📏 Muro</button>
  <button id="btn-bloque" onclick="setTool('bloque')" title="Pinta celdas de 10×10 cm">🧱 Bloques</button>
  <label id="block-h-wrap" style="display:none; color:#cbd5e1; font-size:12px;">alto <input id="block-h" type="number" min="0.5" step="0.5" value="4" style="width:52px;"> m</label>
  <button id="btn-puerta" onclick="setTool('puerta')">🚪 Puerta</button>
  <button onclick="openDoorDesigner()" style="background:#1e3a5f;border-color:#3b82f6;">📐 Diseñar puerta</button>
  <button id="btn-borrar" onclick="setTool('borrar')">🗑️ Borrar</button>
  <div class="separator"></div>
  <button id="btn-sel" onclick="setTool('sel')">🖱️ Seleccionar</button>
  <button id="btn-del-sel" class="danger" onclick="deleteSelected()" style="display:none;">🗑️ Eliminar selección</button>
  <div class="separator"></div>
  <button onclick="finishDraw()" id="btn-finish" style="display:none; background:#0f766e;">✅ Terminar Trazo</button>
  <button id="btn-undo" onclick="undo()">↩️ Deshacer</button>
  <button id="btn-redo" onclick="redo()">↪️ Rehacer</button>
  <button onclick="newMap()" class="danger">📄 Nuevo</button>
  <button onclick="exportJSON()" style="background: #0f766e; border-color: #0d9488;">💾 Copiar JSON</button>
  <button onclick="downloadJSON()" style="background: #0f766e; border-color: #0d9488;">⬇️ mapa.json</button>
  <button onclick="document.getElementById('file-import').click()">📂 Importar</button>
  <input type="file" id="file-import" accept=".json,application/json" style="display:none" onchange="importJSON(this)">
  <button onclick="resetView()" style="background: #475569;">🔍 Centrar</button>
</div>
<div id="canvas-container">
  <canvas id="cv"></canvas>
  <div id="hud">X: 0, Z: 0 | Zoom: 100%</div>
  <div id="hint">Shift+clic: multi-selección · Arrastrar con Seleccionar: caja · Supr: borrar<br>Ctrl+Z / Y: deshacer / rehacer · Flechas: mover · Espacio+arrastrar: desplazar</div>
  <div id="status">Nivel: 0 | Herramienta: Suelo</div>
  <div id="toast"></div>
</div>
<div id="properties">
  <div style="color: #64748b; display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 30px;">Selecciona un elemento.</div>
</div>
<div class="modal" id="door-modal" onmousedown="if(event.target===this)closeDoorDesigner()">
  <div class="modal-box">
    <div class="modal-head">
      <b>🚪 Diseñador de puertas</b>
      <button onclick="closeDoorDesigner()">✕ Cerrar</button>
    </div>
    <div class="modal-body">
      <div class="modal-left">
        <div class="field-group full">
          <label>Tipo</label>
          <div class="row-inputs">
            <select id="dd-type" style="flex:1" onchange="ddSelectType(this.value)"></select>
            <button onclick="ddNew()">＋</button>
            <button onclick="ddDuplicate()">⧉</button>
            <button class="danger" onclick="ddDelete()">🗑</button>
          </div>
        </div>
        <div class="field-group full"><label>Nombre</label><input type="text" data-dd="nombre" oninput="ddField(this)"></div>
        <div class="field-group"><label>Ancho (m)</label><input type="number" data-dd="w" step="0.05" min="0.3" oninput="ddField(this)"></div>
        <div class="field-group"><label>Alto (m)</label><input type="number" data-dd="h" step="0.05" min="0.3" oninput="ddField(this)"></div>
        <div class="field-group"><label>Alféizar</label><input type="number" data-dd="sill" step="0.05" min="0" oninput="ddField(this)"></div>
        <div class="field-group"><label>Grosor marco</label><input type="number" data-dd="fw" step="0.01" min="0.02" oninput="ddField(this)"></div>
        <div class="field-group"><label>Profundidad</label><input type="number" data-dd="depth" step="0.05" min="0.1" oninput="ddField(this)"></div>
        <div class="field-group"><label>Ángulo (°)</label><input type="number" data-dd="angle" step="5" min="0" max="120" oninput="ddField(this)"></div>
        <div class="field-group"><label>Hoja</label>
          <select data-dd="panel" onchange="ddField(this)">
            <option value="single">Simple</option><option value="double">Doble</option><option value="none">Sin hoja</option>
          </select></div>
        <div class="field-group"><label>Bisagra</label>
          <select data-dd="hinge" onchange="ddField(this)"><option value="left">Izquierda</option><option value="right">Derecha</option></select></div>
        <div class="field-group"><label>Apertura</label>
          <select data-dd="swing" onchange="ddField(this)"><option value="in">Adentro</option><option value="out">Afuera</option></select></div>
      </div>
      <div class="modal-right"><canvas id="dd-canvas" width="640" height="400"></canvas></div>
    </div>
    <div class="modal-foot">
      <span id="dd-msg"></span>
      <div class="row-inputs" style="flex-wrap:wrap;">
        <button onclick="ddApplySelected()">Aplicar a seleccionada</button>
        <button onclick="ddApplyAll()">Aplicar a este tipo</button>
        <button onclick="ddUse()" style="background:#0f766e;border-color:#0d9488;">✅ Usar para nuevas</button>
      </div>
    </div>
  </div>
</div>
<script src="./editor-app.js"></script>
</body>
</html>
